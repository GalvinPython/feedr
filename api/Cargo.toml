[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.10.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
reqwest = { version = "0.12.14", features = ["json"] }
dotenvy = "0.15.7"
actix-cors = "0.7.1"
lazy_static = "1.5.0"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "chrono", "time"]}
